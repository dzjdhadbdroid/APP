[package]
name = "sitcom-studio"
version = "0.1.0"
edition = "2021"
description = "Story Bible Management System pour sitcom — 100 % Rust"

[dependencies]
eframe = "0.31"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
ureq = { version = "2", features = ["json"] }
rfd = "0.15"
pdfium-render = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
