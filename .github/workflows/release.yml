name: Build Windows et release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: PDFium pour l'affichage des PDF
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz -OutFile pdfium.tgz
          New-Item -ItemType Directory -Force pdfium-extract | Out-Null
          tar -xzf pdfium.tgz -C pdfium-extract
          New-Item -ItemType Directory -Force assets | Out-Null
          Copy-Item pdfium-extract/bin/pdfium.dll assets/pdfium.dll
      - name: Tests
        run: cargo test --release
        continue-on-error: true
      - name: Compilation
        run: cargo build --release
      - name: Préparer l'archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/sitcom-studio.exe dist/SitcomStudio.exe
          Compress-Archive -Path dist/SitcomStudio.exe -DestinationPath SitcomStudio-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SitcomStudio-windows
          path: dist/SitcomStudio.exe
      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('test-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/SitcomStudio.exe
            SitcomStudio-windows.zip
          prerelease: true
          body: "Version de test. Lance SitcomStudio.exe (données dans %APPDATA%). Signale ce qui ne va pas."
